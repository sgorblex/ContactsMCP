# Optional: release to a self-hosted registry, for Woodpecker CI. The GitHub Actions release (GHCR)
# runs either way. A `v*` tag builds the image for the server's platform and pushes :<version>;
# deploying is left to the server (README, "Releasing to your own registry"). A manual run builds
# the same image without pushing it, to test the pipeline.
#
# No repo trust needed: the build runs in plugin-docker-buildx, which the Woodpecker server must
# allow to run privileged (WOODPECKER_PLUGINS_PRIVILEGED); by name, it admits any version. BuildKit's
# cache lives in the registry as :buildcache. To publish elsewhere, change the registry, repo and
# platform here; only the registry login is secret.
labels:
  platform: linux/arm64

when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

steps:
  - name: build-push
    image: docker.io/woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    when:
      - event: tag
    settings: &build
      registry: reg.aclerici.me
      username:
        from_secret: registry_user
      password:
        from_secret: registry_password
      repo: reg.aclerici.me/contacts/mcp
      tags: ${CI_COMMIT_TAG##v}
      dockerfile: Containerfile
      platforms: linux/arm64
      # The plugin adds created, revision, source and url itself.
      labels:
        - org.opencontainers.image.version=${CI_COMMIT_TAG##v}
      # A list setting, so its comma is escaped; cache_to is a plain string.
      cache_from: 'type=registry\,ref=reg.aclerici.me/contacts/mcp:buildcache'
      cache_to: type=registry,ref=reg.aclerici.me/contacts/mcp:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  - name: build-test
    image: docker.io/woodpeckerci/plugin-docker-buildx:6.1.2@sha256:d26b69cbe748b8a219c707e7889d5ffb3f9214bc3c480c30fe857ff85954267c
    when:
      - event: manual
    settings:
      <<: *build
      tags: ci-test
      dry_run: true
