# Optional: release to a self-hosted registry, for Woodpecker CI. The GitHub Actions release (GHCR)
# runs either way. A `v*` tag builds the image for the server's platform and pushes :<version>;
# deploying is left to the server (README, "Releasing to your own registry"). Needs the repo marked
# "trusted" on the Woodpecker server for the docker socket volume.
when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: build-push
    image: docker:29-cli@sha256:1a4c7cb63513f349bdad01fcc6e0f3f2f67d37b9da86f14dc0d4a0942eecda00
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY:
        from_secret: registry
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_PASSWORD:
        from_secret: registry_password
      REGISTRY_IMAGE:
        from_secret: registry_image
      IMAGE_PLATFORM:
        from_secret: image_platform
    commands:
      - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
      # The scripts are bash; docker:29-cli ships busybox ash only.
      - apk add --no-cache bash
      - scripts/release-push.sh
